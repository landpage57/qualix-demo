<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>System Logs | Qualix</title>

    <link
    rel="icon"
    type="image/svg+xml"
    href="/favicon.svg">

  <script type="module" crossorigin src="/assets/main-CkO5dMS5.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/main-CAKRarnx.css">
</head>

<body
    data-page="system-logs"
    data-page-title="System Logs"
>

<div class="qx-app">

    <!-- ==========================================================
         SIDEBAR
    ========================================================== -->

    <aside id="qx-sidebar" class="qx-sidebar"></aside>

<!-- ==========================================================
         MAIN
========================================================== -->

    <div class="qx-main">

        <!-- Global Header -->
        <div id="qx-header"></div>


<!-- ==========================================================
    MAIN CONTENT
========================================================== -->

        <main class="qx-content">

            <div class="qx-container">

                <div class="system-logs-page">

<!-- ==========================================================
    PAGE HEADER
========================================================== -->

    <section class="qx-dashboard-hero system-logs-hero">

            <div class="qx-dashboard-hero__intro">

                            <h1 class="qx-dashboard-hero__title">
                                System Logs
                            </h1>

                            <p class="qx-dashboard-hero__description">
                                View important activity records across your Qualix system.
                            </p>

                        </div>

                    </section>


                    <!-- ==========================================================
                        SYSTEM LOGS
                    ========================================================== -->

                    <section class="qx-card qx-system-logs-card mt-2">


                        <!-- ======================================================
                            FILTERS
                        ====================================================== -->

                        <div class="qx-system-logs-filters">


                            <!-- Search -->

                            <div
                                class="qx-system-logs-filter qx-system-logs-filter--search"
                            >

                                <div class="qx-system-logs-search">

                                    <i class="ri-search-line"></i>

                                    <input
                                        type="search"
                                        id="systemLogSearch"
                                        class="form-control"
                                        placeholder="Search activity..."
                                        aria-label="Search activity"
                                    >

                                </div>

                            </div>


                            <!-- User -->

                            <div
                                class="qx-system-logs-filter qx-system-logs-filter--user"
                            >

                                <select
                                    id="systemLogUser"
                                    class="form-select"
                                    aria-label="Filter by user"
                                >

                                    <option value="">
                                        All Users
                                    </option>

                                </select>

                            </div>


                            <!-- Module -->

                            <div
                                class="qx-system-logs-filter qx-system-logs-filter--module"
                            >

                                <select
                                    id="systemLogModule"
                                    class="form-select"
                                    aria-label="Filter by module"
                                >

                                    <option value="">
                                        All Modules
                                    </option>

                                </select>

                            </div>


                            <!-- Date Range -->

                            <div
                                class="qx-system-logs-filter qx-system-logs-filter--date"
                            >

                                <div class="qx-system-logs-date-range">

                                    <i class="ri-calendar-line"></i>

                                    <input
                                        type="date"
                                        id="systemLogDateFrom"
                                        class="form-control"
                                        aria-label="Date from"
                                    >

                                    <span>
                                        —
                                    </span>

                                    <input
                                        type="date"
                                        id="systemLogDateTo"
                                        class="form-control"
                                        aria-label="Date to"
                                    >

                                </div>

                            </div>


                            <!-- Filter -->

                            <div
                                class="qx-system-logs-filter qx-system-logs-filter--filter"
                            >

                                <button
                                    type="button"
                                    class="btn qx-system-logs-filter-btn"
                                    id="applySystemLogFilters"
                                >

                                    <i class="ri-filter-3-line"></i>

                                    <span>
                                        Filter
                                    </span>

                                </button>

                            </div>


                            <!-- Reset -->

                            <div
                                class="qx-system-logs-filter qx-system-logs-filter--action"
                            >

                                <button
                                    type="button"
                                    class="btn qx-system-logs-reset-btn"
                                    id="resetSystemLogFilters"
                                >

                                    <i class="ri-refresh-line"></i>

                                    <span>
                                        Reset
                                    </span>

                                </button>

                            </div>

                        </div>


                        <!-- ======================================================
                            ACTIVITY HISTORY HEADER
                        ====================================================== -->

                        <div class="qx-table-header qx-system-logs-header">

                            <div>

                                <h5 class="qx-table-title">
                                    Activity History
                                </h5>

                                <p class="qx-table-description mb-0">
                                    Important activities recorded in Qualix.
                                </p>

                            </div>

                            <div
                                class="qx-system-logs-results"
                                id="systemLogResultsInfo"
                            >
                                Showing 0 results
                            </div>

                        </div>


                        <!-- ======================================================
                            ACTIVITY TABLE
                        ====================================================== -->

                        <div class="qx-system-logs-table table-responsive">

                            <table class="table align-middle">

                                <colgroup>
                                    <col class="qx-col-time">
                                    <col class="qx-col-user">
                                    <col class="qx-col-activity">
                                    <col class="qx-col-module">
                                    <col class="qx-col-detail">
                                </colgroup>

                                <thead>

                                    <tr>

                                        <th>
                                            <span class="qx-system-logs-th-time">
                                                Time
                                                <i class="ri-arrow-up-down-line"></i>
                                            </span>
                                        </th>

                                        <th>
                                            User
                                        </th>

                                        <th>
                                            Activity
                                        </th>

                                        <th>
                                            Module
                                        </th>

                                        <th>
                                            Detail
                                        </th>

                                    </tr>

                                </thead>

                                <tbody id="systemLogTableBody">
                                </tbody>

                            </table>

                        </div>


                        <!-- ======================================================
                            PAGINATION
                        ====================================================== -->

                        <div class="qx-system-logs-pagination">


                            <div
                                class="qx-system-logs-results"
                                id="systemLogPaginationInfo"
                            >
                                Showing 1 to 10 of 12 results
                            </div>


                            <div class="qx-system-logs-pagination-controls">

                                <button
                                    type="button"
                                    class="qx-system-logs-page-btn"
                                    data-page-action="previous"
                                    aria-label="Previous page"
                                >
                                    <i class="ri-arrow-left-s-line"></i>
                                </button>


                                <div
                                    class="qx-system-logs-page-numbers"
                                    id="systemLogPagination"
                                >
                                </div>


                                <button
                                    type="button"
                                    class="qx-system-logs-page-btn"
                                    data-page-action="next"
                                    aria-label="Next page"
                                >
                                    <i class="ri-arrow-right-s-line"></i>
                                </button>


                                <select
                                    id="systemLogPageSize"
                                    class="form-select qx-system-logs-page-size"
                                    aria-label="Rows per page"
                                >

                                    <option value="10" selected>
                                        10 / page
                                    </option>

                                    <option value="20">
                                        20 / page
                                    </option>

                                    <option value="50">
                                        50 / page
                                    </option>

                                </select>

                            </div>

                        </div>

                    </section>

    </div> <!-- End .qx-dashboard -->

</div> <!-- End .qx-container -->

</main>

        <!-- Global Footer -->
        <div id="qx-footer"></div>


</div> <!-- End .qx-main -->

</div> <!-- End .qx-app -->


<!-- ==========================================================
     JAVASCRIPT
========================================================== -->



</body>

</html>

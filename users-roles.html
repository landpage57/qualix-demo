<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Users &amp; Roles | Qualix</title>

    <link
    rel="icon"
    type="image/svg+xml"
    href="/qualix-demo/favicon.svg">

  <script type="module" crossorigin src="/qualix-demo/assets/main-D7z1H8ph.js"></script>
  <link rel="stylesheet" crossorigin href="/qualix-demo/assets/main-CQWTh1KS.css">
</head>

<body
    data-page="users-roles"
    data-page-title="Users & Roles"
>

<div class="qx-app">

<!-- ==========================================================
     SIDEBAR
========================================================== -->

    <aside id="qx-sidebar" class="qx-sidebar"></aside>

<!-- ==========================================================
         MAIN
========================================================== -->

    <div class="qx-main">

        <!-- Global Header -->
        <div id="qx-header"></div>


<!-- ==========================================================
     CONTENT
========================================================== -->

    <main class="qx-content">

        <div class="qx-container">

            <div class="users-roles-page">

<!-- ==========================================================
     BLOCK 1 — PAGE HEADER
========================================================== -->

<section
    class="qx-dashboard-hero users-roles-hero"
>

    <div class="qx-dashboard-hero__intro">

        <h1 class="qx-dashboard-hero__title">
            Users &amp; Roles
        </h1>

        <p class="qx-dashboard-hero__description">
            Manage users who can access Qualix.
        </p>

    </div>


    <div class="qx-dashboard-hero__actions">

        <button
            type="button"
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#userModal"
        >

            <i class="ri-add-line me-2"></i>

            Add User

        </button>

    </div>

</section>


<!-- ==========================================================
     FILTERS
========================================================== -->

<section class="qx-card qx-filter-card mt-2">

    <div class="row g-3 align-items-end">

        <div class="col-12 col-lg-7">

            <label class="qx-form-label">
                Search
            </label>

            <div class="qx-input-icon">

                <i class="ri-search-line"></i>

                <input
                    type="text"
                    id="userSearch"
                    class="form-control"
                    placeholder="Search name or email..."
                >

            </div>

        </div>


        <div class="col-12 col-md-6 col-lg-3">

            <label class="qx-form-label">
                Status
            </label>

            <select
                id="userStatus"
                class="form-select"
            >

                <option value="">
                    All Statuses
                </option>

                <option value="Active">
                    Active
                </option>

                <option value="Inactive">
                    Inactive
                </option>

            </select>

        </div>


        <div class="col-12 col-md-6 col-lg-2">

            <button
                type="button"
                id="resetUserFilters"
                class="btn qx-filter-btn w-100"
            >

                <i class="ri-refresh-line"></i>

                <span class="ms-1">
                    Reset
                </span>

            </button>

        </div>

    </div>

</section>


<!-- ==========================================================
     USER TABLE
========================================================== -->

<section class="qx-card qx-table-card mt-2">

    <div class="qx-table-header">

        <div>

            <h5 class="qx-table-title">
                User List
            </h5>

            <p class="qx-table-description mb-0">
                Users who can access Qualix.
            </p>

        </div>

    </div>


    <div class="table-responsive">

        <table
            id="userTable"
            class="table qx-data-table align-middle">

            <colgroup id="userTableCols"></colgroup>

            <thead id="userTableHead"></thead>

            <tbody id="userTableBody"></tbody>

        </table>

    </div>


    <div class="qx-table-footer">

        <span
            class="qx-results-info"
            id="userResultsInfo">
        </span>

        <div class="d-flex align-items-center gap-3">

            <select
                class="form-select form-select-sm qx-page-size"
                id="userPageSize">

                <option value="10">
                    10 / page
                </option>

                <option value="25">
                    25 / page
                </option>

                <option value="50">
                    50 / page
                </option>

            </select>

            <nav aria-label="Users pagination">

                <ul
                    class="pagination pagination-sm mb-0"
                    id="userPagination">
                </ul>

            </nav>

        </div>

    </div>

</section>


<!-- ==========================================================
     ADD / EDIT USER MODAL
========================================================== -->

<div
    class="modal fade"
    id="userModal"
    tabindex="-1"
    aria-hidden="true">

    <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <div>

                    <h5
                        class="modal-title"
                        id="userModalTitle">
                        Add User
                    </h5>

                    <p
                        class="text-muted mb-0 small"
                        id="userModalSubtitle">
                        Add a user who can access Qualix.
                    </p>

                </div>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div class="row g-3">

                    <div class="col-md-6">

                        <label class="qx-form-label">
                            Full Name
                        </label>

                        <input
                            id="newUserName"
                            class="form-control"
                            placeholder="e.g. John Doe">

                    </div>

                    <div class="col-md-6">

                        <label class="qx-form-label">
                            Email
                        </label>

                        <input
                            id="newUserEmail"
                            type="email"
                            class="form-control"
                            placeholder="e.g. john@company.com">

                    </div>

                    <div class="col-md-6">

                        <label class="qx-form-label">
                            Password
                        </label>

                        <input
                            id="newUserPassword"
                            type="password"
                            class="form-control"
                            placeholder="Enter password...">

                    </div>

                    <div class="col-md-6">

                        <label class="qx-form-label">
                            Confirm Password
                        </label>

                        <input
                            id="newUserPasswordConfirm"
                            type="password"
                            class="form-control"
                            placeholder="Confirm password...">

                    </div>

                    <div class="col-md-6">

                        <label class="qx-form-label">
                            Role
                        </label>

                        <select
                            id="newUserRole"
                            class="form-select">

                            <option selected>
                                Administrator
                            </option>

                        </select>

                    </div>

                    <div class="col-md-6">

                        <label class="qx-form-label">
                            Status
                        </label>

                        <select
                            id="newUserStatus"
                            class="form-select">

                            <option selected>
                                Active
                            </option>

                            <option>
                                Inactive
                            </option>

                        </select>

                    </div>

                </div>

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn qx-btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                    type="button"
                    class="btn qx-btn-primary"
                    id="createUserBtn">

                    <i class="ri-check-line me-2"></i>

                    <span id="userSaveLabel">
                        Add User
                    </span>

                </button>

            </div>

        </div>

    </div> <!-- End .qx-dashboard -->

</div> <!-- End .qx-container -->

</main>

        <!-- Global Footer -->
        <div id="qx-footer"></div>


</div> <!-- End .qx-main -->

</div> <!-- End .qx-app -->



</body>

</html>
